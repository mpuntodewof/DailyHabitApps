server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — cache aggressively (Vite already content-hashes their filenames).
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: any non-asset path resolves to index.html so React Router can take over.
    location / {
        try_files $uri /index.html;
    }

    # Don't cache index.html; we want clients to pick up new builds promptly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}
